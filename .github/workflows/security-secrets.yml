name: Security - secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install integrity-checked Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan history with values redacted
        shell: bash
        run: |
          set -euo pipefail
          # Use built-in rules; repository allowlists must not silently hide findings.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-baseline.toml"
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all' --redact=100 \
            --config "$RUNNER_TEMP/gitleaks-baseline.toml" --gitleaks-ignore-path /dev/null
